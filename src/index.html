<title>Рассказчик у камина</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: сцена 16:9 сверху, ниже панель: локации, озвучка, запись. Режим съёмки оставляет только сцену. */
:root {
  --bg: #0e0807;
  --panel: #1a100e;
  --line: #3b2722;
  --fg: #f2e5d7;
  --muted: #ae9482;
  --accent: #ff9a3c;
  --accent-fg: #1c0d04;
  --rec: #e5484d;
  --display: "IM Fell English SC", Georgia, "Times New Roman", serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.5;
  padding-block: 16px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
h1 {
  font-family: var(--display);
  font-weight: 400;
  font-size: clamp(22px, 5vw, 32px);
  letter-spacing: 0.04em;
  margin: 0;
  text-wrap: balance;
}
.stage {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #000;
  border-radius: 14px;
  overflow: hidden;
  position: relative;
  border: 1px solid var(--line);
}
.stage canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn {
  appearance: none;
  border: 1px solid var(--line);
  background-color: #261714;
  color: var(--fg);
  font: inherit;
  font-weight: 600;
  padding: 10px 16px;
  border-radius: 10px;
  cursor: pointer;
  min-height: 44px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.btn:hover { border-color: var(--accent); }
.btn:focus-visible, input[type=range]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn.primary { background-color: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.rec { border-color: var(--rec); }
.btn.rec.on { background-color: var(--rec); color: #fff; }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }
.btn.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  appearance: none;
  font: inherit;
  font-size: 14px;
  font-weight: 600;
  color: var(--fg);
  background-color: #261714;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 8px 14px;
  min-height: 40px;
  cursor: pointer;
}
.chip[aria-pressed="true"] { background-color: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.grow { flex: 1 1 180px; min-width: 0; display: flex; align-items: center; gap: 10px; }
.grow input[type=range] { flex: 1; min-width: 0; }
label.small, .cap { color: var(--muted); font-size: 13px; white-space: nowrap; }
.cap { font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; font-size: 12px; }
input[type=range] { accent-color: var(--accent); height: 28px; }
input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.status { margin: 0; color: var(--muted); font-size: 14px; min-height: 1.5em; }
.time { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; min-width: 88px; text-align: right; }
.result video { width: 100%; max-height: 60vh; background: #000; border-radius: 10px; }

body.clean { overflow: hidden; padding: 0; }
body.clean .ui { display: none; }
body.clean .stage { position: fixed; inset: 0; max-width: none; aspect-ratio: auto; border-radius: 0; border: 0; z-index: 20; }
.overlay {
  position: absolute;
  left: 50%;
  bottom: max(20px, env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  display: none;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
  z-index: 30;
  width: max-content;
  max-width: 96%;
}
body.clean .overlay.show { display: flex; }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Inter:wght@400;600&display=swap">

<div class="wrap">
  <h1 class="ui">Рассказчик у камина</h1>

  <div class="stage" id="stage">
    <canvas id="cv" width="1920" height="1080" role="img" aria-label="Мультяшный рассказчик в кресле. Фон меняется: камин, детская, подвал, лес, больница, чердак"></canvas>
    <div class="overlay" id="overlay">
      <button class="btn primary" id="ovPlay" type="button">Пуск</button>
      <button class="btn" id="ovLoc" type="button">Следующая локация</button>
      <button class="btn" id="ovExit" type="button">Выйти из режима съёмки</button>
    </div>
  </div>

  <section class="panel ui" aria-label="Управление">
    <span class="cap">Локация</span>
    <div class="chips" id="chips"></div>

    <span class="cap">Озвучка</span>
    <div class="row">
      <label class="btn primary" for="file" id="fileBtn">Загрузить озвучку</label>
      <input type="file" id="file" accept="audio/*,.mp3,.wav,.m4a,.ogg,.aac,.flac">
      <button class="btn" id="play" type="button" disabled>Пуск</button>
      <div class="grow">
        <input type="range" id="seek" min="0" max="1000" value="0" disabled aria-label="Перемотка">
        <span class="time" id="time">0:00 / 0:00</span>
      </div>
    </div>
    <div class="row">
      <button class="btn" id="mic" type="button">Говорить в микрофон</button>
      <button class="btn" id="test" type="button">Проверить рот</button>
      <div class="grow">
        <label class="small" for="sens">Чувствительность</label>
        <input type="range" id="sens" min="1" max="10" value="5">
      </div>
    </div>

    <span class="cap">Звуки локации</span>
    <div class="row">
      <button class="btn on" id="amb" type="button" aria-pressed="true">Звуки: вкл</button>
      <div class="grow">
        <label class="small" for="vol">Громкость</label>
        <input type="range" id="vol" min="0" max="100" value="60">
      </div>
    </div>

    <span class="cap">Видео</span>
    <div class="row">
      <button class="btn rec" id="rec" type="button">Записать ролик</button>
      <button class="btn" id="clean" type="button">Режим съёмки</button>
    </div>
    <p class="status" id="status" role="status" aria-live="polite">Загрузите файл озвучки, и рассказчик начнёт говорить вместе с ним. Звуки локации включатся после первого касания страницы.</p>
  </section>

  <section class="panel ui result" id="result" hidden aria-label="Готовый ролик">
    <video id="preview" controls playsinline></video>
    <div class="row">
      <button class="btn primary" id="saveRec" type="button">Сохранить ролик</button>
      <button class="btn" id="closeRec" type="button">Закрыть</button>
      <span class="status" id="recInfo"></span>
    </div>
  </section>
</div>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var W = 1280, H = 720, SC = 1.5, TAU = Math.PI * 2;
  var cv = $("cv"), g = cv.getContext("2d");
  var bgc = document.createElement("canvas");
  bgc.width = W * SC; bgc.height = H * SC;
  var bx = bgc.getContext("2d");

  /* ===================== рисовальные помощники ===================== */
  function rng(seed) { return function () { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; }; }
  function rr(c, x, y, w, h, r) { c.beginPath(); if (r && c.roundRect) c.roundRect(x, y, w, h, r); else c.rect(x, y, w, h); }
  function R(c, x, y, w, h, f, r) { rr(c, x, y, w, h, r); c.fillStyle = f; c.fill(); }
  function E(c, x, y, rx, ry, f, rot) { c.beginPath(); c.ellipse(x, y, Math.max(rx, 0.01), Math.max(ry, 0.01), rot || 0, 0, TAU); c.fillStyle = f; c.fill(); }
  function PF(c, d, f) { c.fillStyle = f; c.fill(new Path2D(d)); }
  function PS(c, d, s, lw) { c.strokeStyle = s; c.lineWidth = lw; c.lineCap = "round"; c.lineJoin = "round"; c.stroke(new Path2D(d)); }
  function poly(c, pts, f, s, lw) {
    c.beginPath(); c.moveTo(pts[0][0], pts[0][1]);
    for (var i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]);
    c.closePath();
    if (f) { c.fillStyle = f; c.fill(); }
    if (s) { c.strokeStyle = s; c.lineWidth = lw || 1; c.stroke(); }
  }
  function LG(c, x0, y0, x1, y1, st) { var gr = c.createLinearGradient(x0, y0, x1, y1); st.forEach(function (s) { gr.addColorStop(s[0], s[1]); }); return gr; }
  function rgba(rgb, a) { return "rgba(" + rgb[0] + "," + rgb[1] + "," + rgb[2] + "," + a + ")"; }
  function glow(c, x, y, r, rgb, alpha, mode) {
    if (alpha <= 0.001) return;
    c.save();
    c.globalCompositeOperation = mode || "screen";
    c.globalAlpha = Math.min(1, alpha);
    var gr = c.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, rgba(rgb, 1)); gr.addColorStop(0.45, rgba(rgb, 0.35)); gr.addColorStop(1, rgba(rgb, 0));
    c.fillStyle = gr; c.fillRect(x - r, y - r, r * 2, r * 2);
    c.restore();
  }
  function lerp(a, b, u) { return a + (b - a) * u; }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

  var FLAME = new Path2D("M-28 0 C-40 -50 -12 -80 -6 -150 C14 -100 44 -60 28 0Z");
  var CAND = new Path2D("M-5 0 C-8 -10 -2 -16 0 -26 C4 -16 9 -10 5 0Z");
  var KF = [[0, 1, 1, 0], [0.25, 0.9, 1.12, 3], [0.5, 1.08, 0.93, -4], [0.75, 0.95, 1.1, 2], [1, 1, 1, 0]];
  function flick(ph) {
    ph = ph - Math.floor(ph);
    for (var i = 0; i < 4; i++) {
      var a = KF[i], b = KF[i + 1];
      if (ph <= b[0]) { var u = (ph - a[0]) / (b[0] - a[0]); return [lerp(a[1], b[1], u), lerp(a[2], b[2], u), lerp(a[3], b[3], u)]; }
    }
    return [1, 1, 0];
  }
  function flame(c, t, x, y, s, col, dur, off, path) {
    var k = flick((t / 1000 + off) / dur);
    c.save(); c.translate(x, y); c.scale(s, s);
    c.transform(k[0], 0, Math.tan(k[2] * 0.01745), k[1], 0, 0);
    c.fillStyle = col; c.fill(path || FLAME); c.restore();
  }
  function fireStack(c, t, cx, cy, k) {
    flame(c, t, cx - 45 * k, cy - 2 * k, 0.9 * k, "#e0501a", 0.95, 0.2);
    flame(c, t, cx + 45 * k, cy - 2 * k, 0.85 * k, "#e0501a", 1.1, 0.6);
    flame(c, t, cx, cy, 1.15 * k, "#f07a1e", 0.85, 0.4);
    flame(c, t, cx - 22 * k, cy - 2 * k, 0.8 * k, "#ffa229", 0.75, 0.1);
    flame(c, t, cx + 26 * k, cy - 2 * k, 0.75 * k, "#ffa229", 0.9, 0.7);
    flame(c, t, cx, cy, 0.7 * k, "#ffe07a", 0.7, 0.3);
  }
  function embers(c, t, cx, cy, n, rise) {
    for (var i = 0; i < n; i++) {
      var ph = ((t / 1000 + i * 0.7) / 3.4) % 1;
      var a = ph < 0.15 ? ph / 0.15 : 1 - (ph - 0.15) / 0.85;
      c.fillStyle = "rgba(255,179,71," + clamp(a, 0, 1).toFixed(2) + ")";
      c.beginPath(); c.arc(cx + ((i * 37) % 70) - 35 + 24 * ph, cy - (rise || 190) * ph - (i % 3) * 14, 2 + (i % 3) * 0.5, 0, TAU); c.fill();
    }
  }

  /* ===================== кресло и рассказчик ===================== */
  function chair(c) {
    E(c, 330, 640, 260, 26, "rgba(0,0,0,.4)");
    R(c, 150, 196, 360, 410, "#521a22", 64);
    R(c, 190, 236, 280, 340, "#68222c", 44);
    [[260, 300], [400, 300], [260, 420], [400, 420]].forEach(function (p) { E(c, p[0], p[1], 5, 5, "#3d1118"); });
    R(c, 118, 380, 96, 236, "#45131a", 44);
    R(c, 446, 380, 96, 236, "#45131a", 44);
    R(c, 130, 372, 72, 40, "#5b1a23", 20);
    R(c, 458, 372, 72, 40, "#5b1a23", 20);
    R(c, 168, 548, 324, 84, "#68222c", 32);
    R(c, 140, 612, 22, 30, "#1b0c08", 6);
    R(c, 498, 612, 22, 30, "#1b0c08", 6);
  }

  function drawMan(c, m) {
    // ноги
    R(c, 236, 540, 188, 66, "#262a35", 30);
    R(c, 246, 590, 74, 96, "#2d3240", 24);
    R(c, 340, 590, 74, 96, "#2d3240", 24);
    E(c, 283, 694, 46, 16, "#120c0a");
    E(c, 377, 694, 46, 16, "#120c0a");
    // торс
    c.save();
    c.translate(0, 568 * (1 - m.br)); c.scale(1, m.br);
    PF(c, "M246 408 Q330 372 414 408 L432 568 L228 568 Z", "#3d5a4a");
    PS(c, "M330 392 V568", "#2c4337", 3);
    PF(c, "M300 380 L330 410 L360 380 Z", "#e9dfcf");
    [440, 480, 520].forEach(function (y) { E(c, 330, y, 4, 4, "#e9dfcf"); });
    PS(c, "M258 418 Q224 470 212 520 L188 514", "#3d5a4a", 44);
    PS(c, "M402 418 Q436 470 448 520 L472 514", "#3d5a4a", 44);
    E(c, 184, 512, 21, 21, "#e9b98f");
    E(c, 476, 512, 21, 21, "#e9b98f");
    c.restore();
    R(c, 304, 346, 52, 46, "#d49f78", 10);

    // голова
    c.save();
    c.translate(0, m.bob); c.translate(330, 362); c.rotate(m.tilt * 0.01745); c.translate(-330, -362);
    E(c, 272, 302, 11, 16, "#d9a67c");
    E(c, 388, 302, 11, 16, "#d9a67c");
    E(c, 330, 298, 58, 68, "#e9b98f");
    E(c, 330, 298, 58, 68, LG(c, 272, 0, 388, 0, [[0, "rgba(0,0,0,.35)"], [0.6, "rgba(0,0,0,0)"]]));
    PF(c, "M266 290 Q256 214 330 212 Q406 214 394 290 Q384 250 330 246 Q276 250 266 290Z", "#2a1a14");
    PF(c, "M300 222 Q326 196 356 218 Q336 214 322 226Z", "#2a1a14");
    c.save(); c.translate(0, -m.open * 2.5);
    PS(c, "M287 268 Q303 260 320 268", "#2a1a14", 4.5);
    PS(c, "M340 268 Q357 260 373 268", "#2a1a14", 4.5);
    c.restore();
    E(c, 304, 290, 11, 8, "#f6f0e6"); E(c, 356, 290, 11, 8, "#f6f0e6");
    E(c, 305 + m.look, 291, 4.6, 4.6, "#1b1410"); E(c, 357 + m.look, 291, 4.6, 4.6, "#1b1410");
    [304, 356].forEach(function (cx) {
      c.save(); c.translate(cx, 280.5); c.scale(1, m.blink); c.translate(-cx, -280.5);
      E(c, cx, 290, 12.5, 9.5, "#e9b98f"); c.restore();
    });
    c.strokeStyle = "#17110e"; c.lineWidth = 3;
    c.beginPath(); c.arc(304, 290, 17, 0, TAU); c.stroke();
    c.beginPath(); c.arc(356, 290, 17, 0, TAU); c.stroke();
    PS(c, "M321 288 Q330 283 339 288", "#17110e", 3);
    PS(c, "M290 280 Q297 272 308 273", "rgba(255,255,255,.18)", 2);
    PS(c, "M330 296 Q322 318 333 321", "#c48b63", 3);
    // рот
    var h = m.h, rx = m.rx;
    if (h >= 1.2) {
      var cy = 336 + h / 2;
      E(c, 330, cy, rx, h / 2, "#3a0f12");
      c.save(); c.beginPath(); c.ellipse(330, cy, rx, h / 2, 0, 0, TAU); c.clip();
      R(c, 330 - rx * 0.8, 336, rx * 1.6, Math.min(5.5, h * 0.55), "#f4efe6");
      E(c, 330, 336 + h * 0.85, rx * 0.55, Math.max(0, h * 0.3), "#c4545a");
      c.restore();
      PS(c, "M" + (330 - rx) + " 337 Q330 " + (336 + 2 * h + 4) + " " + (330 + rx) + " 337", "#a45a43", 3.2);
    } else {
      PS(c, "M" + (330 - rx) + " 337 Q330 341 " + (330 + rx) + " 337", "#a45a43", 3.2);
    }
    PF(c, "M306 328 Q318 318 330 324 Q342 318 354 328 Q342 331 330 327 Q318 331 306 328Z", "#2a1a14");
    PF(c, "M296 350 Q330 376 364 350 Q330 366 296 350Z", "rgba(42,26,20,.28)");
    c.restore();
  }

  /* ===================== состояние сцены ===================== */
  var S = { flash: 0 };

  /* ----- 0. Комната у камина ----- */
  var fireLoc = {
    name: "Комната у камина",
    bg: function (c) {
      R(c, 0, 0, W, H, LG(c, 0, 0, 0, H, [[0, "#1b1210"], [1, "#2a1a15"]]));
      for (var x = 0; x < W; x += 48) R(c, x, 0, 24, 560, "rgba(0,0,0,.12)");
      R(c, 0, 548, W, 14, "#140b09"); R(c, 0, 562, W, 158, "#2b1810");
      PS(c, "M0 600H1280M0 645H1280M0 695H1280", "#1a0e09", 3);
      PS(c, "M220 562V600M640 562V600M1010 562V600M90 600V645M470 600V645M860 600V645M1180 600V645M300 645V695M760 645V695M1100 645V695", "#1a0e09", 3);
      E(c, 380, 660, 350, 52, "#3a1717");
      c.save(); c.setLineDash([14, 10]); c.beginPath(); c.ellipse(380, 660, 310, 42, 0, 0, TAU); c.strokeStyle = "#6b2d22"; c.lineWidth = 3; c.stroke(); c.restore();
      // окно
      R(c, 590, 100, 200, 230, "#0a0605", 6);
      R(c, 602, 112, 176, 206, LG(c, 0, 112, 0, 318, [[0, "#16243a"], [1, "#0c1422"]]));
      E(c, 700, 170, 26, 26, "rgba(217,221,230,.85)"); E(c, 710, 164, 22, 22, "rgba(22,36,58,.5)");
      PF(c, "M602 250 Q640 225 680 245 Q720 220 778 250 V318 H602Z", "#0a111c");
      PS(c, "M630 252 L640 215 L650 252 M690 248 L702 205 L714 248", "#05080e", 3);
      PS(c, "M690 112V318M602 215H778", "#0a0605", 8);
      R(c, 580, 326, 220, 14, "#150c09", 4);
      // столик со свечой
      R(c, 560, 500, 110, 12, "#241410", 5); R(c, 574, 512, 10, 90, "#1b0f0b"); R(c, 646, 512, 10, 90, "#1b0f0b");
      R(c, 578, 486, 46, 14, "#5b2a1f"); R(c, 582, 478, 38, 8, "#7a3a2a");
      R(c, 636, 462, 14, 38, "#e8dcc4"); E(c, 643, 462, 7, 2.5, "#cdbf9f");
      // картина
      R(c, 946, 104, 168, 138, "#3a2515", 4); R(c, 956, 114, 148, 118, "#0f1a18");
      E(c, 1060, 150, 14, 14, "rgba(201,207,184,.8)");
      PF(c, "M956 232V196L990 176L1024 196V232Z", "#050807");
      PF(c, "M1040 232V200Q1060 170 1090 190L1104 200V232Z", "#070b0a");
      R(c, 982, 200, 8, 10, "rgba(224,166,74,.8)");
      // камин
      R(c, 870, 296, 320, 332, "#3b3330");
      var path = "";
      for (var y = 296, r = 0; y < 628; y += 30, r++) {
        path += "M870 " + y + "H1190";
        for (var xx = 870 + (r % 2 ? 30 : 0); xx < 1190; xx += 60) path += "M" + xx + " " + y + "V" + (y + 30);
      }
      PS(c, path, "#1f1a18", 3);
      R(c, 846, 270, 368, 30, "#4a2c18", 4); R(c, 846, 296, 368, 8, "#2a190d");
      PF(c, "M918 624V420Q918 360 1030 360Q1142 360 1142 420V624Z", "#0b0504");
      PF(c, "M934 624V424Q934 376 1030 376Q1126 376 1126 424V624Z", "#120806");
      R(c, 846, 624, 368, 26, "#2a2321", 4); R(c, 846, 624, 368, 6, "#463b37");
      R(c, 878, 236, 12, 34, "#e8dcc4"); R(c, 1160, 244, 12, 26, "#e8dcc4");
      chair(c);
    },
    back: function (c, t) {
      c.save(); c.translate(1030, 560); c.scale(1, 110 / 130);
      var gr = c.createRadialGradient(0, 0, 0, 0, 0, 130);
      gr.addColorStop(0, "rgba(255,154,60,.95)"); gr.addColorStop(0.5, "rgba(210,74,18,.45)"); gr.addColorStop(1, "rgba(210,74,18,0)");
      c.fillStyle = gr; c.fillRect(-130, -130, 260, 260); c.restore();
      R(c, 940, 596, 180, 26, "#2b1710", 13);

    if (!blob.size) { setStatus("Запись получилась пустой. Попробуйте ещё раз."); return; }
    recBlob = blob; recExt = /mp4/.test(type) ? "mp4" : "webm";
    if (recUrl) URL.revokeObjectURL(recUrl);
    recUrl = URL.createObjectURL(blob);
    $("preview").src = recUrl;
    $("result").hidden = false;
    $("recInfo").textContent = (blob.size / 1048576).toFixed(1) + " МБ, " + recExt + ", 1920×1080";
    setStatus("Ролик записан. Проверьте превью и сохраните.");
    try { $("result").scrollIntoView({ behavior: "smooth", block: "nearest" }); } catch (e) {}
  }
  $("closeRec").addEventListener("click", function () { $("result").hidden = true; $("preview").removeAttribute("src"); });
  function note(t) { $("recInfo").textContent = t; setStatus(t); }
  function capPlatform() { try { return window.Capacitor && window.Capacitor.getPlatform ? window.Capacitor.getPlatform() : "web"; } catch (e) { return "web"; } }
  function isNative() { try { var C = window.Capacitor; if (!C) return false; if (C.isNativePlatform) return !!C.isNativePlatform(); return capPlatform() !== "web"; } catch (e) { return false; } }
  function toB64(buf) { var s = "", u = new Uint8Array(buf); for (var i = 0; i < u.length; i += 32768) s += String.fromCharCode.apply(null, u.subarray(i, i + 32768)); return btoa(s); }
  function errText(e) { return e && (e.message || e.errorMessage) ? String(e.message || e.errorMessage) : String(e || ""); }
  function writeChunks(FS, blob, name, dir) {
    var CH = 1024 * 1024, pos = 0, uri = "";
    function next() {
      if (pos >= blob.size) return Promise.resolve(uri);
      var part = blob.slice(pos, pos + CH), first = pos === 0; pos += CH;
      note("Готовлю файл… " + Math.min(100, Math.round(pos / blob.size * 100)) + "%");
      return part.arrayBuffer().then(function (buf) {
        var o = { path: name, data: toB64(buf), directory: dir };
        return first ? FS.writeFile(o).then(function (r) { uri = r.uri; }) : FS.appendFile(o);
      }).then(next);
    }
    return next();
  }
  function plug(n) {
    var C = window.Capacitor, p = C && C.Plugins && C.Plugins[n];
    if (!p && C && typeof C.registerPlugin === "function") p = C.registerPlugin(n);
    if (!p) throw new Error("плагин " + n + " недоступен");
    return p;
  }
  function saveNative(blob, name) {
    var FS = plug("Filesystem"), SH = plug("Share");
    note("Готовлю файл…");
    writeChunks(FS, blob, name, "CACHE").then(function (uri) {
      note("Открываю меню «Поделиться»…");
      return SH.share({ title: "Ролик «Рассказчик»", files: [uri], dialogTitle: "Сохранить или отправить ролик" });
    }).then(function () { note("Готово. Если выбрали «Сохранить», файл уже в телефоне."); })
      .catch(function (e) {
        var m = errText(e);
        if (/cancel/i.test(m)) { note("Сохранение отменено."); return; }
        note("Меню не открылось (" + m + "). Сохраняю в папку «Документы»…");
        writeChunks(FS, blob, name, "DOCUMENTS").then(function () {
          note("Сохранено в папку «Документы» на телефоне: " + name);
        }).catch(function (e2) {
          note("Не удалось сохранить: " + errText(e2) + ". Нажмите на видео выше и удерживайте — может появиться «Скачать».");
        });
      });
  }
  $("saveRec").addEventListener("click", function () {
    try {
      if (!recBlob) { note("Ролика нет. Сначала запишите его."); return; }
      note("Сохраняю… (" + capPlatform() + ")");
      var d = new Date(), p = function (n) { return (n < 10 ? "0" : "") + n; };
      var name = "rasskazchik-" + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + "-" + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds()) + "." + recExt;
      if (isNative()) { saveNative(recBlob, name); return; }
      var use = window.claude && window.claude.use ? window.claude.use("downloads") : Promise.resolve(null);
      Promise.resolve(use).then(function (dl) {
        if (!dl) {
          try {
            var a = document.createElement("a"); a.href = recUrl; a.download = name; document.body.appendChild(a); a.click(); a.remove();
            note("Загрузка запущена: " + name + ". Если файла нет, нажмите на видео и удерживайте.");
          } catch (e) { note("Кнопка сохранения здесь недоступна. Нажмите на видео и удерживайте."); }
          return;
        }
        return dl.save({ filename: name, data: recBlob }).then(function (r) {
          note(r && r.status === "saved" ? "Файл сохранён: " + name : "Файл передан.");
        });
      }).catch(function (e) {
        if (e && e.code === "declined") note("Сохранение отменено.");
        else note("Не удалось сохранить файл: " + errText(e));
      });
    } catch (e) { note("Ошибка сохранения: " + errText(e)); }
  });

  /* ===================== главный цикл ===================== */
  function rawLevel(now) {
    if (mode === "test") {
      var t = (now - testStart) / 1000;
      if (t > 5) return 0;
      var syl = Math.max(0, Math.sin(t * 9.5)) * (0.55 + 0.45 * Math.sin(t * 2.1 + 1));
      return syl * (Math.sin(t * 1.3) > -0.7 ? 1 : 0.1) * 0.12;
    }
    if (!analyser) return 0;
    var active = (mode === "mic") || (mode === "file" && !audio.paused);
    if (!active) return 0;
    analyser.getFloatTimeDomainData(buf);
    var s = 0; for (var i = 0; i < buf.length; i++) s += buf[i] * buf[i];
    return Math.sqrt(s / buf.length);
  }

  var man = { br: 1, bob: 0, tilt: 0, open: 0, h: 0, rx: 14, blink: 0, look: 0 };
  var blinkAt = 2200, blinkEnd = 0, lookTarget = 0, lookAt = 4000, last = 0, lastT = 0;

  // Отдельный холст для записи: рисуется по таймеру из воркера, поэтому не зависит от того,
  // виден ли экран (браузер замораживает requestAnimationFrame у страницы вне видимой области).
  var rc = document.createElement("canvas"); rc.width = 1920; rc.height = 1080;
  var rg = rc.getContext("2d");
  var recDrive = false, ticker = null;
  function startTicker(fn, ms) {
    try {
      var url = URL.createObjectURL(new Blob(["setInterval(function(){postMessage(1)}," + ms + ")"], { type: "text/javascript" }));
      var w = new Worker(url); w.onmessage = fn;
      return { stop: function () { w.terminate(); URL.revokeObjectURL(url); } };
    } catch (e) {
      var id = setInterval(fn, ms);
      return { stop: function () { clearInterval(id); } };
    }
  }
  function tick() {
    var now = performance.now();
    if (!recDrive || now - last < 30) return;
    last = now; step(now);
  }
  function frame(now) {
    requestAnimationFrame(frame);
    if (recDrive || now - last < 30) return;
    last = now; step(now);
  }
  function step(now) {
    var dt = Math.min(100, now - (lastT || now)); lastT = now;

    var raw = rawLevel(now);
    peakEnv = Math.max(peakEnv * 0.9993, raw, 0.015);
    var norm = raw / peakEnv;
    lvl += (norm - lvl) * (norm > lvl ? 0.6 : 0.22);
    var s = +$("sens").value, thr = 0.32 - 0.027 * s;
    var open = Math.pow(clamp((lvl - thr) / 0.6, 0, 1), 0.85);
    man.open = open;
    man.h = open * 22 * (0.88 + 0.12 * Math.sin(now * 0.021));
    man.rx = 14 + open * 5;
    man.bob = open * 1.6;
    man.tilt = Math.sin(now * 0.0007) * 1.1 + open * 0.8 * Math.sin(now * 0.012);
    man.br = 1 + Math.sin(now * 0.0016) * 0.004;
    if (now > blinkAt && now > blinkEnd) { blinkEnd = now + 160; blinkAt = now + 2200 + Math.random() * 3600; }
    var b = 0; if (now < blinkEnd) { var p = 1 - (blinkEnd - now) / 160; b = p < 0.5 ? p * 2 : (1 - p) * 2; }
    man.blink = b;
    if (now > lookAt) { lookTarget = Math.random() < 0.35 ? 4 : 0; lookAt = now + 1800 + Math.random() * 4000; }
    man.look += (lookTarget - man.look) * 0.08;

    if (fadeDir !== 0) {
      fade += fadeDir * dt / 260;
      if (fadeDir > 0 && fade >= 1) { fade = 1; cur = pending; buildBg(cur); ambSwitch(cur); fadeDir = -1; }
      else if (fadeDir < 0 && fade <= 0) { fade = 0; fadeDir = 0; }
    }

    var c = recDrive ? rg : g;
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.globalAlpha = 1; c.globalCompositeOperation = "source-over";
    c.drawImage(bgc, 0, 0);
    c.setTransform(SC, 0, 0, SC, 0, 0);
    var L = LOCS[cur];
    L.back(c, now);
    drawMan(c, man);
    L.front(c, now);
    var vg = c.createRadialGradient(640, 360, 380, 640, 360, 760);
    vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(0,0,0,.72)");
    c.fillStyle = vg; c.fillRect(0, 0, W, H);
    if (fade > 0.001) { c.fillStyle = "rgba(0,0,0," + fade.toFixed(3) + ")"; c.fillRect(0, 0, W, H); }
    if (recDrive) { g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.globalCompositeOperation = "source-over"; g.drawImage(rc, 0, 0); }
  }
  requestAnimationFrame(frame);

  function lightning() {
    var n = 0;
    (function pulse() {
      if (n === 0) thunder();
      S.flash = n % 2 === 0 ? 0.75 : 0.1; n++;
      if (n < 4) setTimeout(pulse, 70 + Math.random() * 60);
      else setTimeout(function () { S.flash = 0; }, 140);
    })();
    setTimeout(lightning, 14000 + Math.random() * 26000);
  }
  setTimeout(lightning, 9000);
})();
</script>
