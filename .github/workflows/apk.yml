name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Generate Android project
        run: |
          npx cap add android
          node scripts/android-setup.mjs
          npx cap sync android

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Keep APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: rasskazchik-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to the release page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Rasskazchik.apk
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest Rasskazchik.apk \
            --title "Рассказчик (APK)" \
            --notes "Свежая сборка для Android, коммит ${GITHUB_SHA::7}. Скачайте Rasskazchik.apk, откройте на телефоне и разрешите установку из этого источника." \
            --target "$GITHUB_SHA"
